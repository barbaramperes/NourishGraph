[pytest]
# NourishGraph Test Configuration

# Test paths
testpaths = tests

# Python path
pythonpath = .

# Markers
markers =
    unit: Unit tests for individual components
    integration: Integration tests for multi-component systems
    e2e: End-to-end pipeline tests
    safety: Safety and adversarial tests
    ablation: Ablation study tests
    baseline: Baseline comparison tests
    slow: Slow tests that require --runslow flag
    performance: Performance benchmark tests

# Default options
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra
    --color=yes

# Async mode
asyncio_mode = auto

# Ignore patterns
norecursedirs = 
    .git
    node_modules
    __pycache__
    .pytest_cache
    frontend
    papers_pdf
    papers_txt

# Log format
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
